get_forecast:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: arome_solar_forecast
    days:
      default: 2
      selector:
        number:
          min: 1
          max: 7
    resolution:
      default: 30min
      selector:
        select:
          options:
            - 15min
            - 30min
find_best_window:
  fields:
    config_entry_id:
      selector:
        config_entry:
          integration: arome_solar_forecast
    duration:
      required: true
      example: 75
      selector:
        number:
          min: 15
          max: 720
          step: 15
          unit_of_measurement: min
    day:
      default: today
      selector:
        select:
          options:
            - today
            - tomorrow
          translation_key: day
    power_kw:
      example: 2.0
      selector:
        number:
          min: 0.01
          max: 1000
          step: 0.01
          unit_of_measurement: kW
          mode: box
    base_load_kw:
      default: 0
      selector:
        number:
          min: 0
          max: 1000
          step: 0.01
          unit_of_measurement: kW
          mode: box
    after:
      selector:
        time:
    before:
      selector:
        time:
